name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the original V8 project
        run: |
          ZIP="banshar-adel-al-khamri-project-v8.zip"
          test -f "$ZIP"
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .

      - name: Inspect reminder source
        run: |
          echo "=== ReminderReceiver.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderReceiver.kt || true
          echo "=== ReminderScheduler.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderScheduler.kt || true
          echo "=== CustomerActivity reminder references ==="
          grep -RniE 'موعد|زيت|remind|reminder' app/src/main/java/com/adel/banshar || true

      - name: Apply only vehicle-specific reminder update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("app/src/main/java/com/adel/banshar/ReminderReceiver.kt")
          s=p.read_text(encoding="utf-8")
          old='val msg = "مرحباً \${c.name}، حان موعد تغيير الزيت لسيارتك. بنشر عادل الخامري - فروة. نسعد بخدمتك."'
          new='''val isMotorcycle = c.vehicle.contains("دراجة") || c.vehicle.contains("دباب") || c.vehicle.contains("نارية") || c.vehicle.contains("موتور") || c.vehicle.contains("موتوسيكل")
          val msg = if (isMotorcycle) {
              "حان موعد تغيير زيت الدراجة النارية 🛢️🏍️\\nحياكم الله في بنشر عادل الخامري – فروة، ونتشرف بزيارتكم 🌷"
          } else {
              "حان موعد تغيير زيت سيارتكم 🛢️🚗\\nحياكم الله في بنشر عادل الخامري – فروة، ونشرف بزيارتكم 🌷"
          }'''
          if old not in s: raise SystemExit("ReminderReceiver message not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")

          p=Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt")
          s=p.read_text(encoding="utf-8")
          old='private fun reminderMessage()="مرحباً \${name.text}، حان موعد تغيير الزيت لسيارتك. بنشر عادل الخامري - فروة. نسعد بخدمتك."'
          new='''private fun reminderMessage(): String {
              val v = vehicle.text.toString().trim()
              return if (v.contains("دراجة") || v.contains("دباب") || v.contains("نارية") || v.contains("موتور") || v.contains("موتوسيكل")) {
                  "حان موعد تغيير زيت الدراجة النارية 🛢️🏍️\\nحياكم الله في بنشر عادل الخامري – فروة، ونتشرف بزيارتكم 🌷"
              } else {
                  "حان موعد تغيير زيت سيارتكم 🛢️🚗\\nحياكم الله في بنشر عادل الخامري – فروة، ونشرف بزيارتكم 🌷"
              }
          }'''
          if old not in s: raise SystemExit("CustomerActivity reminder message not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")

          p=Path("app/build.gradle.kts")
          s=p.read_text(encoding="utf-8")
          s=s.replace('versionCode = 1','versionCode = 2').replace('versionName = "1.0"','versionName = "1.1.0"')
          p.write_text(s,encoding="utf-8")
          PY

      - name: Upload original V8 source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: original-v8-source
          path: extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
