name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/unzip-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest project ZIP
        run: |
          ZIP=$(for f in $(ls -t *.zip); do unzip -tq "$f" >/dev/null 2>&1 && { echo "$f"; break; }; done)
          test -n "$ZIP"
          echo "Using ZIP: $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Fix CustomerActivity compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("extracted/app/src/main/java/com/adel/banshar/CustomerActivity.kt"),
              Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt"),
          ]

          for p in paths:
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              if "import android.content.DialogInterface" not in s:
                  s = s.replace(
                      "import android.content.Intent",
                      "import android.content.DialogInterface\nimport android.content.Intent",
                      1,
                  )
              if "import androidx.appcompat.app.AlertDialog" not in s:
                  s = s.replace(
                      "import androidx.appcompat.app.AppCompatActivity",
                      "import androidx.appcompat.app.AlertDialog\nimport androidx.appcompat.app.AppCompatActivity",
                      1,
                  )
              s = s.replace(
                  '.setPositiveButton("حفظ") { _, _ ->',
                  '.setPositiveButton("حفظ") { _: DialogInterface, _: Int ->',
                  1,
              )
              p.write_text(s, encoding="utf-8")
          PY

      - name: Prepare corrected project archive
        run: |
          rm -f banshar-adel-al-khamri-project-fixed.zip
          (cd extracted && zip -qr ../banshar-adel-al-khamri-project-fixed.zip .)
          echo "Created corrected project archive."

      - name: Save corrected project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banshar-adel-al-khamri-project-fixed.zip
          git commit -m "Fix CustomerActivity build errors [skip ci]" || true
          git push

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source-inspection
          path: extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
