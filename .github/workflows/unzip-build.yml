name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the original V8 project
        run: |
          ZIP="banshar-adel-al-khamri-project-v8.zip"
          test -f "$ZIP"
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .

      - name: Inspect reminder source
        run: |
          echo "=== ReminderReceiver.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderReceiver.kt || true
          echo "=== ReminderScheduler.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderScheduler.kt || true
          echo "=== CustomerActivity reminder references ==="
          grep -RniE 'موعد|زيت|remind|reminder' app/src/main/java/com/adel/banshar || true

      - name: Fix AlertDialog compile imports only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              s=s.replace("import android.app.AlertDialog\n","")
              if "import androidx.appcompat.app.AlertDialog" not in s:
                  s=s.replace("import androidx.appcompat.app.AppCompatActivity","import androidx.appcompat.app.AlertDialog\nimport androidx.appcompat.app.AppCompatActivity",1)
              p.write_text(s,encoding="utf-8")
          PY

      - name: Upload original V8 source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: original-v8-source
          path: extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
