name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use original V8 project
        run: |
          unzip -q banshar-adel-al-khamri-project-v8.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .
      - name: Add automatic and manual backup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backup = r'''package com.adel.banshar
          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          object BackupManager {
              fun createBackup(context: Context): Uri? {
                  return try {
                      Db(context).close()
                      val stamp = SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.US).format(Date())
                      val name = "بنشر_عادل_الخامري_نسخة_${stamp}.zip"
                      val temp = File(context.cacheDir, name)
                      ZipOutputStream(FileOutputStream(temp)).use { zip ->
                          val dbFile = context.getDatabasePath("banshar.db")
                          if (dbFile.exists()) addFile(zip, dbFile, "banshar.db")
                          context.filesDir.listFiles().orEmpty().filter { it.isFile }.forEach { addFile(zip, it, "files/\${it.name}") }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, name)
                              put(MediaStore.Downloads.MIME_TYPE, "application/zip")
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/بنشر عادل الخامري/نسخ احتياطية")
                          }
                          val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return null
                          context.contentResolver.openOutputStream(uri)?.use { out -> FileInputStream(temp).use { it.copyTo(out) } }
                          temp.delete()
                          return uri
                      }
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "بنشر عادل الخامري/نسخ احتياطية")
                      dir.mkdirs()
                      val target = File(dir, name)
                      temp.copyTo(target, overwrite = true)
                      temp.delete()
                      Uri.fromFile(target)
                  } catch (_: Exception) { null }
              }
              private fun addFile(zip: ZipOutputStream, file: File, entryName: String) {
                  zip.putNextEntry(ZipEntry(entryName))
                  FileInputStream(file).use { it.copyTo(zip) }
                  zip.closeEntry()
              }
          }
          '''
          Path("app/src/main/java/com/adel/banshar/BackupManager.kt").write_text(backup, encoding="utf-8")

          Path("app/src/main/java/com/adel/banshar/BackupReceiver.kt").write_text(r'''package com.adel.banshar
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          class BackupReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != Intent.ACTION_BOOT_COMPLETED) BackupManager.createBackup(context)
                  BackupScheduler.schedule(context)
              }
          }
          ''', encoding="utf-8")

          Path("app/src/main/java/com/adel/banshar/BackupScheduler.kt").write_text(r'''package com.adel.banshar
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar
          object BackupScheduler {
              fun schedule(context: Context) {
                  val alarm = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = PendingIntent.getBroadcast(context, 8101, Intent(context, BackupReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 2); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  alarm.setInexactRepeating(AlarmManager.RTC_WAKEUP, cal.timeInMillis, AlarmManager.INTERVAL_DAY, intent)
              }
          }
          ''', encoding="utf-8")

          main=Path("app/src/main/java/com/adel/banshar/MainActivity.kt")
          s=main.read_text(encoding="utf-8")
          s=s.replace("setContentView(R.layout.activity_main)", "setContentView(R.layout.activity_main)"+chr(10)+"        BackupScheduler.schedule(this)",1)
          anchor='findViewById<Button>(R.id.btnInventory).setOnClickListener { startActivity(Intent(this, InventoryActivity::class.java)) }'
          handler='''findViewById<Button>(R.id.btnBackup).setOnClickListener {
              db.close()
              val uri=BackupManager.createBackup(this)
              db=Db(this)
              Toast.makeText(this, if(uri!=null) "تم إنشاء النسخة الاحتياطية في مجلد التنزيلات" else "تعذر إنشاء النسخة الاحتياطية", Toast.LENGTH_LONG).show()
          }'''
          s=s.replace(anchor,anchor+chr(10)+"        "+handler.replace(chr(10),chr(10)+"        "),1)
          main.write_text(s,encoding="utf-8")

          layout=Path("app/src/main/res/layout/activity_main.xml")
          s=layout.read_text(encoding="utf-8")
          if 'android:id="@+id/btnBackup"' not in s:
              button='<Button android:id="@+id/btnBackup" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="نسخة احتياطية 💾" android:layout_marginTop="8dp" />'
              pos=s.rfind("</LinearLayout>")
              if pos<0: raise SystemExit("root LinearLayout closing tag not found")
              s=s[:pos]+button+chr(10)+s[pos:]
          layout.write_text(s,encoding="utf-8")

          main=Path("app/src/main/java/com/adel/banshar/MainActivity.kt")
          s=main.read_text(encoding="utf-8")
          if "R.id.btnBackup" not in s:
              marker='        findViewById<Button>(R.id.btnInventory).setOnClickListener { startActivity(Intent(this, InventoryActivity::class.java)) }'
              handler='''        findViewById<Button>(R.id.btnBackup).setOnClickListener {
              val uri = BackupManager.createBackup(this)
              Toast.makeText(this, if (uri != null) "تم إنشاء النسخة الاحتياطية في التنزيلات" else "تعذر إنشاء النسخة الاحتياطية", Toast.LENGTH_LONG).show()
          }'''
              if marker not in s: raise SystemExit("inventory listener not found")
              s=s.replace(marker,marker+chr(10)+handler,1)
          if "BackupScheduler.schedule(this)" not in s:
              s=s.replace("        setContentView(R.layout.activity_main)", "        setContentView(R.layout.activity_main)"+chr(10)+"        BackupScheduler.schedule(this)",1)
          main.write_text(s,encoding="utf-8")

          manifest=Path("app/src/main/AndroidManifest.xml")
          s=manifest.read_text(encoding="utf-8")
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'+chr(10)+"    <application", 1)
          receiver='<receiver android:name=".BackupReceiver" android:exported="false">'+chr(10)+'            <intent-filter>'+chr(10)+'                <action android:name="android.intent.action.BOOT_COMPLETED" />'+chr(10)+'            </intent-filter>'+chr(10)+'        </receiver>'
          if 'android:name=".BackupReceiver"' not in s:
              s=s.replace('<receiver android:name=".ReminderReceiver" android:exported="false" />', '<receiver android:name=".ReminderReceiver" android:exported="false" />'+chr(10)+receiver, 1)
          manifest.write_text(s,encoding="utf-8")

          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text(encoding="utf-8").replace("versionCode = 4","versionCode = 5").replace('versionName = "1.3.0"','versionName = "1.4.0"')
          gradle.write_text(s,encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
