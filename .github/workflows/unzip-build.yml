name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the original V8 project
        run: |
          ZIP="banshar-adel-al-khamri-project-v8.zip"
          test -f "$ZIP"
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .

      - name: Inspect reminder source
        run: |
          echo "=== ReminderReceiver.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderReceiver.kt || true
          echo "=== ReminderScheduler.kt ==="
          sed -n '1,240p' app/src/main/java/com/adel/banshar/ReminderScheduler.kt || true
          echo "=== CustomerActivity reminder references ==="
          grep -RniE 'موعد|زيت|remind|reminder' app/src/main/java/com/adel/banshar || true

      - name: Apply vehicle type selector and reminder update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Customer screen: make vehicle type mandatory (Car / Motorcycle),
          # while keeping the existing vehicle/model field for the make/model.
          xml=Path("app/src/main/res/layout/activity_customer.xml")
          s=xml.read_text(encoding="utf-8")
          old='<EditText android:id="@+id/vehicle" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="السيارة / الموديل"/>'
          new='''<Spinner android:id="@+id/vehicleType" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <EditText android:id="@+id/vehicle" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="الماركة / الموديل"/>'''
          if old not in s: raise SystemExit("vehicle field not found in XML")
          s=s.replace(old,new,1)
          xml.write_text(s,encoding="utf-8")

          p=Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt")
          s=p.read_text(encoding="utf-8")

          s=s.replace(
              'private lateinit var name: EditText; private lateinit var phone: EditText; private lateinit var vehicle: EditText; private lateinit var oilType: EditText',
              'private lateinit var name: EditText; private lateinit var phone: EditText; private lateinit var vehicleType: Spinner; private lateinit var vehicle: EditText; private lateinit var oilType: EditText',
              1)

          s=s.replace(
              'name=findViewById(R.id.name); phone=findViewById(R.id.phone); vehicle=findViewById(R.id.vehicle); oilType=findViewById(R.id.oilType);',
              'name=findViewById(R.id.name); phone=findViewById(R.id.phone); vehicleType=findViewById(R.id.vehicleType); vehicle=findViewById(R.id.vehicle); oilType=findViewById(R.id.oilType);\n        val vehicleTypes=arrayOf("سيارة","دراجة نارية"); vehicleType.adapter=ArrayAdapter(this,android.R.layout.simple_spinner_dropdown_item,vehicleTypes)',
              1)

          old_save='''    private fun save(){
        if(name.text.toString().trim().isEmpty()){name.error="اكتب اسم العميل";return}
        val daysValue=(days.text.toString().toIntOrNull()?:30).coerceAtLeast(1)
        val last=existing?.lastDate?.ifBlank{today()}?:today(); val next=dateAfter(last,daysValue)
        val c=Customer(id=customerId,name=name.text.toString().trim(),phone=phone.text.toString().trim(),vehicle=vehicle.text.toString().trim(),oilType=oilType.text.toString().trim(),oilImagePath=oilImagePath,remaining=existing?.remaining?:0.0,paid=existing?.paid?:0.0,days=daysValue,lastDate=last,nextDate=next)
        val id=if(existing==null) db.insert(c) else {db.updateCustomer(c);c.id}
        val saved=if(existing==null) c.copy(id=id) else c
        ReminderScheduler.schedule(this,saved)
        Toast.makeText(this,"تم الحفظ",Toast.LENGTH_SHORT).show();finish()
    }'''
          new_save='''    private fun save(){
        if(name.text.toString().trim().isEmpty()){name.error="اكتب اسم العميل";return}
        if(vehicleType.selectedItemPosition<0){Toast.makeText(this,"اختر نوع المركبة",Toast.LENGTH_SHORT).show();return}
        val type=vehicleType.selectedItem?.toString()?.trim().orEmpty()
        if(type!="سيارة" && type!="دراجة نارية"){Toast.makeText(this,"اختر نوع المركبة",Toast.LENGTH_SHORT).show();return}
        val daysValue=(days.text.toString().toIntOrNull()?:30).coerceAtLeast(1)
        val last=existing?.lastDate?.ifBlank{today()}?:today(); val next=dateAfter(last,daysValue)
        val model=vehicle.text.toString().trim()
        val vehicleValue=if(model.isBlank()) type else "$type - $model"
        val c=Customer(id=customerId,name=name.text.toString().trim(),phone=phone.text.toString().trim(),vehicle=vehicleValue,oilType=oilType.text.toString().trim(),oilImagePath=oilImagePath,remaining=existing?.remaining?:0.0,paid=existing?.paid?:0.0,days=daysValue,lastDate=last,nextDate=next)
        val id=if(existing==null) db.insert(c) else {db.updateCustomer(c);c.id}
        val saved=if(existing==null) c.copy(id=id) else c
        ReminderScheduler.schedule(this,saved)
        Toast.makeText(this,"تم الحفظ",Toast.LENGTH_SHORT).show();finish()
    }'''
          if old_save not in s: raise SystemExit("save function not found")
          s=s.replace(old_save,new_save,1)

          old_fill='''    private fun fill(c:Customer){name.setText(c.name);phone.setText(c.phone);vehicle.setText(c.vehicle);oilType.setText(c.oilType);days.setText(c.days.toString());oilImagePath=c.oilImagePath;showOilImage();showRemaining()}'''
          new_fill='''    private fun fill(c:Customer){
        name.setText(c.name);phone.setText(c.phone)
        val isMotorcycle=c.vehicle.contains("دراجة نارية") || c.vehicle.contains("دباب") || c.vehicle.contains("نارية") || c.vehicle.contains("موتور") || c.vehicle.contains("موتوسيكل")
        vehicleType.setSelection(if(isMotorcycle) 1 else 0)
        vehicle.setText(c.vehicle.removePrefix("دراجة نارية - ").removePrefix("سيارة - "))
        oilType.setText(c.oilType);days.setText(c.days.toString());oilImagePath=c.oilImagePath;showOilImage();showRemaining()
    }'''
          if old_fill not in s: raise SystemExit("fill function not found")
          s=s.replace(old_fill,new_fill,1)

          old_msg='''    private fun reminderMessage()="مرحباً ${name.text}، حان موعد تغيير الزيت لسيارتك. بنشر عادل الخامري - فروة. نسعد بخدمتك."'''
          new_msg='''    private fun reminderMessage():String {
        val type=vehicleType.selectedItem?.toString().orEmpty()
        return if(type=="دراجة نارية") {
            "حان موعد تغيير زيت الدراجة النارية 🛢️🏍️\\nحياكم الله في بنشر عادل الخامري – فروة، ونتشرف بزيارتكم 🌷"
        } else {
            "حان موعد تغيير زيت سيارتكم 🛢️🚗\\nحياكم الله في بنشر عادل الخامري – فروة، ونشرف بزيارتكم 🌷"
        }
    }'''
          if old_msg not in s: raise SystemExit("old reminder message not found")
          s=s.replace(old_msg,new_msg,1)

          p.write_text(s,encoding="utf-8")

          # Automatic reminder uses the saved mandatory type stored in vehicle.
          p=Path("app/src/main/java/com/adel/banshar/ReminderReceiver.kt")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'(?s)\s*val isMotorcycle = .*?\n\s*val msg = if \(isMotorcycle\) \{.*?\n\s*\} else \{.*?\n\s*\}', '''\n        val isMotorcycle = c.vehicle.contains("دراجة نارية") || c.vehicle.contains("دباب") || c.vehicle.contains("نارية") || c.vehicle.contains("موتور") || c.vehicle.contains("موتوسيكل")
        val msg = if (isMotorcycle) {
            "حان موعد تغيير زيت الدراجة النارية 🛢️🏍️\\nحياكم الله في بنشر عادل الخامري – فروة، ونتشرف بزيارتكم 🌷"
        } else {
            "حان موعد تغيير زيت سيارتكم 🛢️🚗\\nحياكم الله في بنشر عادل الخامري – فروة، ونشرف بزيارتكم 🌷"
        }''', s, count=1)
          p.write_text(s,encoding="utf-8")

          p=Path("app/build.gradle.kts")
          s=p.read_text(encoding="utf-8")
          s=s.replace("versionCode = 1","versionCode = 3").replace('versionName = "1.0"','versionName = "1.2.0"').replace('versionCode = 2','versionCode = 3').replace('versionName = "1.1.0"','versionName = "1.2.0"')
          p.write_text(s,encoding="utf-8")
          PY

      - name: Upload original V8 source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: original-v8-source
          path: extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
