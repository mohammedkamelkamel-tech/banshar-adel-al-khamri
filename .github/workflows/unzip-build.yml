name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "v13patch/**"
      - ".github/workflows/unzip-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest project ZIP
        run: |
          ZIP=$(for f in $(ls -t banshar-adel-al-khamri-project-v11.zip banshar-adel-al-khamri-project-v10.zip *.zip 2>/dev/null | awk '!seen[$0]++'); do unzip -tq "$f" >/dev/null 2>&1 && { echo "$f"; break; }; done)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .

      - name: Fix CustomerActivity compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              if "import android.content.DialogInterface" not in s: s=s.replace("import android.content.Intent","import android.content.DialogInterface\nimport android.content.Intent",1)
              if "import androidx.appcompat.app.AlertDialog" not in s: s=s.replace("import androidx.appcompat.app.AppCompatActivity","import androidx.appcompat.app.AlertDialog\nimport androidx.appcompat.app.AppCompatActivity",1)
              s=s.replace('.setPositiveButton("حفظ") { _, _ ->','.setPositiveButton("حفظ") { _: DialogInterface, _: Int ->',1)
              p.write_text(s,encoding="utf-8")
          PY

      - name: Apply v13 service type and backup settings
        run: |
          cp v13patch/BackupManager.kt app/src/main/java/com/adel/banshar/BackupManager.kt
          cp v13patch/BackupScheduler.kt app/src/main/java/com/adel/banshar/BackupScheduler.kt
          cp v13patch/BackupReceiver.kt app/src/main/java/com/adel/banshar/BackupReceiver.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/res/layout/activity_main.xml")
          x=p.read_text(encoding="utf-8").replace('<EditText android:id="@+id/search"', '<Button android:id="@+id/btnSettings" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⚙️ الإعدادات"/>\n<EditText android:id="@+id/search"')
          p.write_text(x,encoding="utf-8")
          p=Path("app/src/main/res/layout/activity_customer.xml")
          x=p.read_text(encoding="utf-8").replace('<EditText android:id="@+id/oilType"', '<TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="نوع الخدمة" android:textStyle="bold" android:paddingTop="8dp"/>\n<Spinner android:id="@+id/serviceType" android:layout_width="match_parent" android:layout_height="wrap_content"/>\n<EditText android:id="@+id/oilType"')
          p.write_text(x,encoding="utf-8")
          p=Path("app/src/main/java/com/adel/banshar/Db.kt")
          x=p.read_text(encoding="utf-8").replace('put("serviceType", "");','put("serviceType", c.serviceType);')
          p.write_text(x,encoding="utf-8")
          p=Path("app/src/main/java/com/adel/banshar/CustomerActivity.kt")
          x=p.read_text(encoding="utf-8")
          x=x.replace('private lateinit var name: EditText; private lateinit var phone: EditText; private lateinit var vehicle: EditText; private lateinit var oilType: EditText',
          'private lateinit var name: EditText; private lateinit var phone: EditText; private lateinit var vehicle: EditText; private lateinit var oilType: EditText; private lateinit var serviceType: Spinner\n    private val serviceOptions = arrayOf("تغيير زيت", "سرويس", "تغيير زيت وسرويس", "فحص وصيانة", "إصلاح بنشر", "خدمة أخرى")')
          x=x.replace('oilType=findViewById(R.id.oilType); days=', 'oilType=findViewById(R.id.oilType); serviceType=findViewById(R.id.serviceType); serviceType.adapter=ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, serviceOptions); days=')
          x=x.replace('oilType=oilType.text.toString().trim(),oilImagePath=', 'oilType=oilType.text.toString().trim(),serviceType=serviceType.selectedItem?.toString().orEmpty(),oilImagePath=')
          x=x.replace('vehicle.setText(c.vehicle);oilType.setText(c.oilType);days', 'vehicle.setText(c.vehicle);serviceType.setSelection(serviceOptions.indexOf(c.serviceType).coerceAtLeast(0));oilType.setText(c.oilType);days')
          p.write_text(x,encoding="utf-8")
          p=Path("app/src/main/java/com/adel/banshar/MainActivity.kt")
          x=p.read_text(encoding="utf-8")
          x=x.replace('import android.os.Bundle','import android.os.Bundle\nimport android.app.TimePickerDialog\nimport android.content.DialogInterface')
          x=x.replace('findViewById<Button>(R.id.btnInventory).setOnClickListener { startActivity(Intent(this, InventoryActivity::class.java)) }','findViewById<Button>(R.id.btnInventory).setOnClickListener { startActivity(Intent(this, InventoryActivity::class.java)) }\n        findViewById<Button>(R.id.btnSettings).setOnClickListener { backupSettings() }\n        BackupScheduler.schedule(this)')
          block='''    private fun backupSettings() {
        val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(28,8,28,8)}
        val auto=CheckBox(this).apply{text="تفعيل النسخ الاحتياطي التلقائي يوميًا";isChecked=BackupManager.isEnabled(this@MainActivity)}
        val time=Button(this).apply{text=String.format(Locale.US,"وقت النسخ: %02d:%02d",BackupManager.hour(this@MainActivity),BackupManager.minute(this@MainActivity))}
        val now=Button(this).apply{text="💾 إنشاء نسخة احتياطية الآن"}
        val restore=Button(this).apply{text="📂 استرجاع نسخة احتياطية"}
        val info=TextView(this).apply{text="مكان الحفظ:\\n"+BackupManager.FOLDER+"\\n\\nآخر نسخة: "+BackupManager.last(this@MainActivity)+"\\nيتم الاحتفاظ بآخر 7 نسخ.";setPadding(0,12,0,12)}
        box.addView(auto);box.addView(time);box.addView(now);box.addView(restore);box.addView(info)
        val d=androidx.appcompat.app.AlertDialog.Builder(this).setTitle("إعدادات النسخ الاحتياطي").setView(box).setPositiveButton("حفظ الإعدادات",null).setNegativeButton("إغلاق",null).create()
        time.setOnClickListener{TimePickerDialog(this,{_,h,m->time.text=String.format(Locale.US,"وقت النسخ: %02d:%02d",h,m);time.tag=h.toString()+":"+m.toString()},BackupManager.hour(this),BackupManager.minute(this),true).show()}
        now.setOnClickListener{val ok=BackupManager.create(this);Toast.makeText(this,if(ok)"تم إنشاء النسخة الاحتياطية بنجاح" else "تعذر إنشاء النسخة الاحتياطية",Toast.LENGTH_LONG).show();info.text="مكان الحفظ:\\n"+BackupManager.FOLDER+"\\n\\nآخر نسخة: "+BackupManager.last(this)+"\\nيتم الاحتفاظ بآخر 7 نسخ."}
        restore.setOnClickListener{startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply{type="application/octet-stream";addCategory(Intent.CATEGORY_OPENABLE)},REQUEST_RESTORE)}
        d.setOnShowListener{d.getButton(DialogInterface.BUTTON_POSITIVE).setOnClickListener{val q=(time.tag?.toString() ?: BackupManager.hour(this).toString()+":"+BackupManager.minute(this).toString()).split(":");val h=q.getOrNull(0)?.toIntOrNull()?:2;val m=q.getOrNull(1)?.toIntOrNull()?:0;BackupManager.configure(this,auto.isChecked,h.coerceIn(0,23),m.coerceIn(0,59));Toast.makeText(this,if(auto.isChecked)"تم حفظ إعدادات النسخ وسيتم النسخ يوميًا" else "تم إيقاف النسخ التلقائي",Toast.LENGTH_SHORT).show();d.dismiss()}}
        d.show()
    }
    override fun onActivityResult(r:Int,result:Int,data:Intent?){super.onActivityResult(r,result,data);if(r==REQUEST_RESTORE&&result==RESULT_OK&&data?.data!=null){val ok=BackupManager.restore(this,data.data!!);if(ok){db=Db(this);showList(db.all());Toast.makeText(this,"تم استرجاع النسخة. يفضّل إعادة فتح التطبيق.",Toast.LENGTH_LONG).show()}else Toast.makeText(this,"تعذر استرجاع النسخة الاحتياطية",Toast.LENGTH_LONG).show()}}
'''
          x=x.replace('    private fun showList(items: List<Customer>) {',block+'\n    private fun showList(items: List<Customer>) {')
          x=x.replace('    private var showingDue = false','    private var showingDue = false\n    companion object { const val REQUEST_RESTORE = 9131 }')
          p.write_text(x,encoding="utf-8")
          p=Path("app/src/main/AndroidManifest.xml")
          x=p.read_text(encoding="utf-8").replace('<receiver android:name=".ReminderReceiver" android:exported="false" />','<receiver android:name=".ReminderReceiver" android:exported="false" />\n        <receiver android:name=".BackupReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>')
          p.write_text(x,encoding="utf-8")
          p=Path("app/build.gradle.kts")
          x=p.read_text(encoding="utf-8").replace('versionCode = 1','versionCode = 13').replace('versionName = "1.0"','versionName = "1.3.0"')
          p.write_text(x,encoding="utf-8")
          PY

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source-inspection
          path: extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
