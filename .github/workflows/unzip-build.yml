name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/unzip-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest project ZIP
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using ZIP: $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Inspect CustomerActivity source
        run: |
          echo "=== CustomerActivity imports ==="
          sed -n '1,25p' app/src/main/java/com/adel/banshar/CustomerActivity.kt
          echo "=== CustomerActivity around failing lines ==="
          nl -ba app/src/main/java/com/adel/banshar/CustomerActivity.kt | sed -n '90,112p'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
