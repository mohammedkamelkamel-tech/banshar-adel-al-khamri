name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use original V8 project
        run: |
          unzip -q banshar-adel-al-khamri-project-v10.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .
          python3 v13patch/apply_v13_patch.py
      - name: Add automatic and manual backup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backup = r'''package com.adel.banshar
          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          object BackupManager {
              fun createBackup(context: Context): Uri? {
                  return try {
                      Db(context).close()
                      val stamp = SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.US).format(Date())
                      val name = "بنشر_عادل_الخامري_نسخة_${stamp}.zip"
                      val temp = File(context.cacheDir, name)
                      ZipOutputStream(FileOutputStream(temp)).use { zip ->
                          val dbFile = context.getDatabasePath("banshar.db")
                          if (dbFile.exists()) addFile(zip, dbFile, "banshar.db")
                          context.filesDir.listFiles().orEmpty().filter { it.isFile }.forEach { addFile(zip, it, "files/\${it.name}") }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, name)
                              put(MediaStore.Downloads.MIME_TYPE, "application/zip")
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/بنشر عادل الخامري/نسخ احتياطية")
                          }
                          val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return null
                          context.contentResolver.openOutputStream(uri)?.use { out -> FileInputStream(temp).use { it.copyTo(out) } }
                          temp.delete()
                          return uri
                      }
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "بنشر عادل الخامري/نسخ احتياطية")
                      dir.mkdirs()
                      val target = File(dir, name)
                      temp.copyTo(target, overwrite = true)
                      temp.delete()
                      Uri.fromFile(target)
                  } catch (_: Exception) { null }
              }
              private fun addFile(zip: ZipOutputStream, file: File, entryName: String) {
                  zip.putNextEntry(ZipEntry(entryName))
                  FileInputStream(file).use { it.copyTo(zip) }
                  zip.closeEntry()
              }
          }
          '''
          Path("app/src/main/java/com/adel/banshar/BackupManager.kt").write_text(backup, encoding="utf-8")

          Path("app/src/main/java/com/adel/banshar/BackupReceiver.kt").write_text(r'''package com.adel.banshar
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          class BackupReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != Intent.ACTION_BOOT_COMPLETED) BackupManager.createBackup(context)
                  BackupScheduler.schedule(context)
              }
          }
          ''', encoding="utf-8")

          Path("app/src/main/java/com/adel/banshar/BackupScheduler.kt").write_text(r'''package com.adel.banshar
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar
          object BackupScheduler {
              fun schedule(context: Context) {
                  val alarm = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = PendingIntent.getBroadcast(context, 8101, Intent(context, BackupReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 2); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  alarm.setInexactRepeating(AlarmManager.RTC_WAKEUP, cal.timeInMillis, AlarmManager.INTERVAL_DAY, intent)
              }
          }
          ''', encoding="utf-8")

          main=Path("app/src/main/java/com/adel/banshar/MainActivity.kt")
          s=main.read_text(encoding="utf-8")
          s=s.replace("setContentView(R.layout.activity_main)", "setContentView(R.layout.activity_main)"+chr(10)+"        BackupScheduler.schedule(this)",1)
          anchor='findViewById<Button>(R.id.btnInventory).setOnClickListener { startActivity(Intent(this, InventoryActivity::class.java)) }'
          handler='''findViewById<Button>(R.id.btnBackup).setOnClickListener {
              db.close()
              val uri=BackupManager.createBackup(this)
              db=Db(this)
              Toast.makeText(this, if(uri!=null) "تم إنشاء النسخة الاحتياطية في مجلد التنزيلات" else "تعذر إنشاء النسخة الاحتياطية", Toast.LENGTH_LONG).show()
          }'''
          s=s.replace(anchor,anchor+chr(10)+"        "+handler.replace(chr(10),chr(10)+"        "),1)
          main.write_text(s,encoding="utf-8")

          layout=Path("app/src/main/res/layout/activity_main.xml")
          xml='''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="14dp" android:layoutDirection="rtl"
              android:background="#0B1220">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:padding="18dp" android:background="#17243A">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="بنشر عادل الخامري" android:textColor="#FF9F1C" android:textSize="27sp"
                      android:textStyle="bold" android:gravity="center" android:padding="6dp"/>
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="خدمة سريعة • متابعة العملاء • تغيير الزيت" android:textColor="#D8E1EF"
                      android:textSize="13sp" android:gravity="center"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:layout_marginTop="10dp">
                  <Button android:id="@+id/btnAdd" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="إضافة عميل" android:backgroundTint="#FF9F1C" android:textColor="#0B1220"/>
                  <Button android:id="@+id/btnInventory" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="المخزون" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <Button android:id="@+id/btnDue" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="المستحقات" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
                  <Button android:id="@+id/btnAll" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="كل العملاء" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <Button android:id="@+id/btnSale" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="بيع" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
                  <Button android:id="@+id/btnToday" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="مبيعات اليوم" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <Button android:id="@+id/btnGeneral" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="التقرير العام" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
                  <Button android:id="@+id/btnExpenses" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="المصروفات" android:backgroundTint="#253752" android:textColor="#FFFFFF"/>
              </LinearLayout>
              <Button android:id="@+id/btnBackup" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="4dp" android:text="نسخة احتياطية 💾"
                  android:backgroundTint="#FF9F1C" android:textColor="#0B1220"/>
              <EditText android:id="@+id/search" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="8dp" android:hint="بحث باسم العميل أو رقم الهاتف"
                  android:inputType="text" android:singleLine="true" android:textColor="#FFFFFF"
                  android:textColorHint="#9BAAC0" android:backgroundTint="#FF9F1C"/>
              <TextView android:id="@+id/tvSummary" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:padding="12dp" android:layout_marginTop="6dp" android:textColor="#FFFFFF"
                  android:textSize="16sp" android:background="#17243A"/>
              <ListView android:id="@+id/listCustomers" android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_marginTop="8dp" android:layout_weight="1" android:divider="#33445E"
                  android:dividerHeight="1dp" android:background="#111C2E"/>
          </LinearLayout>
          '''
          layout.write_text(xml,encoding="utf-8")

          # Add restore-from-ZIP support and a separate restore button.
          backup_path=Path("app/src/main/java/com/adel/banshar/BackupManager.kt")
          bs=backup_path.read_text(encoding="utf-8")
          restore_method='''    fun restoreBackup(context: Context, uri: Uri): Boolean {
                  return try {
                      val target = context.getDatabasePath("banshar.db")
                      target.parentFile?.mkdirs()
                      File(context.getDatabasePath("banshar.db-wal").absolutePath).delete()
                      File(context.getDatabasePath("banshar.db-shm").absolutePath).delete()
                      var restored = false
                      context.contentResolver.openInputStream(uri)?.use { input ->
                          java.util.zip.ZipInputStream(input).use { zip ->
                              var entry = zip.nextEntry
                              while (entry != null) {
                                  if (entry.name == "banshar.db") {
                                      FileOutputStream(target).use { output -> zip.copyTo(output) }
                                      restored = true
                                  }
                                  zip.closeEntry()
                                  entry = zip.nextEntry
                              }
                          }
                      }
                      restored
                  } catch (_: Exception) { false }
              }

          '''
          if "fun restoreBackup(context: Context, uri: Uri)" not in bs:
              bs=bs.replace("    private fun addFile(zip: ZipOutputStream", restore_method+"    private fun addFile(zip: ZipOutputStream",1)
          backup_path.write_text(bs,encoding="utf-8")

          layout=Path("app/src/main/res/layout/activity_main.xml")
          xs=layout.read_text(encoding="utf-8")
          backup_button='''<Button android:id="@+id/btnBackup" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="4dp" android:text="نسخة احتياطية 💾"
                  android:backgroundTint="#FF9F1C" android:textColor="#0B1220"/>'''
          restore_button=backup_button+'''\n              <Button android:id="@+id/btnRestore" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginTop="4dp" android:text="استعادة نسخة احتياطية 📂"
                  android:backgroundTint="#253752" android:textColor="#FFFFFF"/>'''
          if 'android:id="@+id/btnRestore"' not in xs:
              if backup_button not in xs: raise SystemExit("Could not locate backup button in generated layout")
              xs=xs.replace(backup_button,restore_button,1)
              layout.write_text(xs,encoding="utf-8")

          main=Path("app/src/main/java/com/adel/banshar/MainActivity.kt")
          ms=main.read_text(encoding="utf-8")
          restore_listener='''        findViewById<Button>(R.id.btnRestore).setOnClickListener {
              val pick = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                  addCategory(Intent.CATEGORY_OPENABLE)
                  type = "application/zip"
              }
              startActivityForResult(pick, 8102)
          }

          '''
          if 'findViewById<Button>(R.id.btnRestore)' not in ms:
              insertion='        BackupScheduler.schedule(this)'
              if insertion in ms: ms=ms.replace(insertion,insertion+"\\n"+restore_listener.rstrip(),1)
              else: raise SystemExit("Could not locate MainActivity initialization to add restore listener")
          if 'override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?)' not in ms:
              handler='''
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 8102 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      db.close()
                      val restored = BackupManager.restoreBackup(this, uri)
                      db = Db(this)
                      Toast.makeText(this, if (restored) "تمت استعادة النسخة الاحتياطية" else "تعذرت الاستعادة: اختر ملف نسخة ZIP صحيحًا", Toast.LENGTH_LONG).show()
                      if (restored) recreate()
                  }
              }
          '''
              idx=ms.rfind("}")
              if idx < 0: raise SystemExit("Could not locate MainActivity closing brace")
              ms=ms[:idx]+handler+ms[idx:]
          main.write_text(ms,encoding="utf-8")

          # Install the provided gold-and-navy workshop logo as the Android launcher icon.
          python3 - <<'ICONPY'
          import base64
          from pathlib import Path
          logo = base64.b64decode("")
          res = Path("app/src/main/res")
          (res / "drawable-nodpi").mkdir(parents=True, exist_ok=True)
          (res / "drawable-nodpi/banshar_logo.jpg").write_bytes(logo)
          manifest = res.parent / "AndroidManifest.xml"
          ms = manifest.read_text(encoding="utf-8")
          ms = ms.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/banshar_logo"')
          ms = ms.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/banshar_logo"')
          manifest.write_text(ms, encoding="utf-8")
          ICONPY

          manifest=Path("app/src/main/AndroidManifest.xml")
          s=manifest.read_text(encoding="utf-8")
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'+chr(10)+"    <application", 1)
          receiver='<receiver android:name=".BackupReceiver" android:exported="false">'+chr(10)+'            <intent-filter>'+chr(10)+'                <action android:name="android.intent.action.BOOT_COMPLETED" />'+chr(10)+'            </intent-filter>'+chr(10)+'        </receiver>'
          if 'android:name=".BackupReceiver"' not in s:
              s=s.replace('<receiver android:name=".ReminderReceiver" android:exported="false" />', '<receiver android:name=".ReminderReceiver" android:exported="false" />'+chr(10)+receiver, 1)
          manifest.write_text(s,encoding="utf-8")

          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text(encoding="utf-8").replace("versionCode = 4","versionCode = 5").replace('versionName = "1.3.0"','versionName = "1.4.0"')
          gradle.write_text(s,encoding="utf-8")
          PY

      - name: Package full project source
        run: |
          rm -rf /tmp/banshar-project
          mkdir -p /tmp/banshar-project
          cp -a . /tmp/banshar-project/
          rm -rf /tmp/banshar-project/.git /tmp/banshar-project/.gradle
          cd /tmp
          zip -qr banshar-adel-al-khamri-full-project.zip banshar-project
          cp banshar-adel-al-khamri-full-project.zip "$GITHUB_WORKSPACE/"

      - name: Upload full project source
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-full-project
          path: banshar-adel-al-khamri-full-project.zip
          retention-days: 90

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Diagnose generated Db.kt
        run: |
          nl -ba app/src/main/java/com/adel/banshar/Db.kt | sed -n '35,55p'
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banshar-adel-al-khamri-apk
          path: app/build/outputs/apk/debug/app-debug.apk
